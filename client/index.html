<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Journal</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f5f6f8;
      color: #1a1a1a;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 14px;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .card small {
      color: #666;
      display: block;
    }

    .card b {
      font-size: 20px;
    }

    form {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    input,
    select,
    button {
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      background: #1a73e8;
      color: #fff;
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      background: #fff;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
    }

    th,
    td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .pos {
      color: #0a8a3a;
    }

    .neg {
      color: #c62828;
    }

    .scroll {
      overflow-x: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
    }

    .toolbar label {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      gap: 12px;
    }

    .pagination span {
      font-size: 14px;
      color: #444;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
